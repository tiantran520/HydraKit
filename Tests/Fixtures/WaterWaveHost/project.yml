name: WaterWaveProbe
options:
  bundleIdPrefix: dev.hydrakit.probe
  deploymentTarget:
    iOS: '17.0'
packages:
  HydraKit:
    path: ../../..
targets:
  WaterWaveProbe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hydrakit.probe.waterwave
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: HydraKit
        product: HydraKitUI
  WaterWaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: WaterWaveProbe
    dependencies:
      - target: WaterWaveProbe
schemes:
  WaterWaveProbe:
    build:
      targets:
        WaterWaveProbe: all
    test:
      targets: [WaterWaveUITests]
